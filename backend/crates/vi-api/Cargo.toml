[package]
name = "vi-api"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
vi-core.workspace = true
vi-db.workspace = true
axum = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v5"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
async-graphql = "7"
utoipa = "5"
vi-ingest.workspace = true
redis = { version = "0.27", features = ["tokio-comp"] }
sha2 = "0.11"
subtle = "2"
futures-util = "0.3"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "vi-server"
path = "src/main.rs"


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
