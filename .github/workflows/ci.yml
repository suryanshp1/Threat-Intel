name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: dtolnay/rust-toolchain@1.120.0
        with: {components: rustfmt}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: backend}
      - run: npm --prefix frontend ci
      - run: cargo fmt --manifest-path backend/Cargo.toml --all --check
      - run: npm --prefix frontend audit --audit-level=moderate
      - run: node scripts/audit-dependencies.mjs
      - run: npm test
      - run: cargo build --manifest-path backend/Cargo.toml --locked
      - run: node scripts/test-database-tls.mjs
      - run: npm run setup
      - run: node scripts/test-production.mjs
      - run: npm run build
      - if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down --volumes
