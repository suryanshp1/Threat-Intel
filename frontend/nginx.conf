# Query strings can contain one-use authorization codes. Log only the path.
log_format sentinel '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
 access_log /dev/stdout sentinel;
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 10m;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
 # Callback query strings contain credentials; API logs safe rejection categories.
 location = /api/auth/oidc/callback { error_log /dev/null; proxy_pass http://vi-api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; proxy_buffering off; }
 location /api/ { proxy_pass http://vi-api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; proxy_buffering off; }
 location /api-docs/ { proxy_pass http://vi-api:8080; }
 location /scalar { proxy_pass http://vi-api:8080; }
 location /taxii2/ { proxy_pass http://vi-api:8080; }
 location /health { proxy_pass http://vi-api:8080; }
 location /readyz { proxy_pass http://vi-api:8080; }
 location / { try_files $uri $uri/ /index.html; }
}
